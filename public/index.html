<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polk County Florida — Collaborative Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      color: #eee;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 340px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      background: #16213e;
      border-right: 1px solid #0f3460;
      z-index: 1000;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 18px 16px 12px;
      background: #0f3460;
      border-bottom: 1px solid #1a4a8a;
    }

    #sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4fc3f7;
      letter-spacing: 0.3px;
    }

    #sidebar-header p {
      font-size: 0.75rem;
      color: #90a4ae;
      margin-top: 2px;
    }

    /* ── Form ── */
    #add-form {
      padding: 14px 14px 10px;
      border-bottom: 1px solid #0f3460;
      background: #1a2a4a;
    }

    #add-form h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4fc3f7;
      margin-bottom: 10px;
    }

    .form-row { margin-bottom: 8px; }

    .form-row label {
      display: block;
      font-size: 0.72rem;
      color: #90a4ae;
      margin-bottom: 3px;
    }

    .form-row input,
    .form-row textarea {
      width: 100%;
      padding: 7px 9px;
      background: #0f1e3a;
      border: 1px solid #1e3a6a;
      border-radius: 6px;
      color: #eee;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .form-row input:focus,
    .form-row textarea:focus { border-color: #4fc3f7; }

    .form-row-inline {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-row-inline .form-row { flex: 1; margin-bottom: 0; }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .color-row label { font-size: 0.72rem; color: #90a4ae; }

    .color-swatches {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .swatch.selected,
    .swatch:hover { border-color: #fff; transform: scale(1.15); }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #btn-geocode {
      flex: 1;
      padding: 8px;
      background: #1e88e5;
      color: #fff;
    }

    #btn-save {
      flex: 1;
      padding: 8px;
      background: #2e7d32;
      color: #fff;
    }

    #btn-geocode:disabled,
    #btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    #geocode-status {
      font-size: 0.72rem;
      color: #90a4ae;
      margin-top: 4px;
      min-height: 16px;
    }

    #geocode-status.ok { color: #66bb6a; }
    #geocode-status.err { color: #ef5350; }

    /* ── Entries list ── */
    #entries-header {
      padding: 10px 14px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #entries-header h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4fc3f7;
    }

    #entry-count {
      font-size: 0.72rem;
      color: #90a4ae;
      background: #0f3460;
      padding: 2px 7px;
      border-radius: 10px;
    }

    #search-box {
      padding: 0 14px 8px;
    }

    #search-input {
      width: 100%;
      padding: 6px 9px;
      background: #0f1e3a;
      border: 1px solid #1e3a6a;
      border-radius: 6px;
      color: #eee;
      font-size: 0.8rem;
      outline: none;
    }

    #search-input:focus { border-color: #4fc3f7; }

    #entries-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
    }

    #entries-list::-webkit-scrollbar { width: 5px; }
    #entries-list::-webkit-scrollbar-track { background: transparent; }
    #entries-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

    .entry-card {
      background: #0f1e3a;
      border: 1px solid #1e3a6a;
      border-radius: 8px;
      padding: 10px 10px 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .entry-card:hover { border-color: #4fc3f7; background: #162040; }

    .entry-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .entry-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e3f2fd;
      display: flex;
      align-items: flex-start;
    }

    .entry-address {
      font-size: 0.75rem;
      color: #78909c;
      margin-top: 2px;
      margin-left: 16px;
    }

    .entry-meta {
      font-size: 0.68rem;
      color: #546e7a;
      margin-top: 4px;
      margin-left: 16px;
    }

    .entry-notes {
      font-size: 0.74rem;
      color: #90a4ae;
      margin-top: 3px;
      margin-left: 16px;
      font-style: italic;
    }

    .entry-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      color: #546e7a;
      font-size: 0.85rem;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .entry-delete:hover { background: #1a1a2e; color: #ef5350; }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #546e7a;
      font-size: 0.82rem;
    }

    /* ── Map ── */
    #map {
      flex: 1;
      height: 100%;
    }

    /* ── Map click hint ── */
    #map-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,52,96,0.92);
      color: #90caf9;
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 999;
      border: 1px solid #1e3a6a;
      white-space: nowrap;
    }

    /* ── Popup styling ── */
    .leaflet-popup-content-wrapper {
      background: #16213e;
      color: #eee;
      border: 1px solid #1e3a6a;
      border-radius: 10px;
    }

    .leaflet-popup-tip { background: #16213e; }

    .popup-label { font-weight: 700; font-size: 0.95rem; color: #4fc3f7; }
    .popup-address { font-size: 0.8rem; color: #90a4ae; margin-top: 3px; }
    .popup-notes { font-size: 0.78rem; color: #b0bec5; margin-top: 4px; font-style: italic; }
    .popup-meta { font-size: 0.7rem; color: #546e7a; margin-top: 5px; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #sidebar { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid #0f3460; }
      body { flex-direction: column; }
      #map { height: 55vh; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📍 Polk County, FL — Address Map</h1>
    <p>Collaborative address tracker — changes save for everyone</p>
  </div>

  <div id="add-form">
    <h2>Add an Address</h2>

    <div class="form-row">
      <label>Your Name</label>
      <input type="text" id="input-name" placeholder="Anonymous" />
    </div>

    <div class="form-row">
      <label>Label / Description *</label>
      <input type="text" id="input-label" placeholder="e.g. John's House" />
    </div>

    <div class="form-row">
      <label>Address *</label>
      <input type="text" id="input-address" placeholder="123 Main St, Lakeland, FL" />
    </div>

    <div class="form-row">
      <label>Notes (optional)</label>
      <textarea id="input-notes" rows="2" placeholder="Any additional info…"></textarea>
    </div>

    <div class="color-row">
      <label>Pin color:</label>
      <div class="color-swatches" id="color-swatches"></div>
    </div>

    <div id="geocode-status"></div>

    <div class="form-actions">
      <button id="btn-geocode">🔍 Find on Map</button>
      <button id="btn-save" disabled>💾 Save Pin</button>
    </div>
  </div>

  <div id="entries-header">
    <h2>Saved Addresses</h2>
    <span id="entry-count">0</span>
  </div>

  <div id="search-box">
    <input type="text" id="search-input" placeholder="Search saved addresses…" />
  </div>

  <div id="entries-list"></div>
</div>

<div id="map"></div>
<div id="map-hint">Click anywhere on the map to place a pin, or use the search above</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const POLK_CENTER = [27.9944, -81.5158];
const POLK_ZOOM   = 11;

const COLORS = [
  { hex: '#e74c3c', name: 'Red'    },
  { hex: '#e67e22', name: 'Orange' },
  { hex: '#f1c40f', name: 'Yellow' },
  { hex: '#2ecc71', name: 'Green'  },
  { hex: '#3498db', name: 'Blue'   },
  { hex: '#9b59b6', name: 'Purple' },
  { hex: '#1abc9c', name: 'Teal'   },
  { hex: '#e91e63', name: 'Pink'   },
];

let selectedColor = COLORS[0].hex;
let pendingLat = null, pendingLng = null;
let markers = {};       // id → L.marker
let allEntries = [];    // cache for search

// ── Map setup ───────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView(POLK_CENTER, POLK_ZOOM);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// ── Color swatches ──────────────────────────────────────────────────────────
const swatchContainer = document.getElementById('color-swatches');
COLORS.forEach(c => {
  const el = document.createElement('div');
  el.className = 'swatch' + (c.hex === selectedColor ? ' selected' : '');
  el.style.background = c.hex;
  el.title = c.name;
  el.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    selectedColor = c.hex;
  });
  swatchContainer.appendChild(el);
});

// ── Helpers ─────────────────────────────────────────────────────────────────
function makeIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24c0-6.6-5.4-12-12-12z"
          fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="5" fill="#fff" opacity="0.9"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [24, 36],
    iconAnchor: [12, 36],
    popupAnchor: [0, -38],
  });
}

function formatDate(dt) {
  return new Date(dt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function setStatus(msg, type = '') {
  const el = document.getElementById('geocode-status');
  el.textContent = msg;
  el.className = type;
}

// ── Pending pin (before save) ────────────────────────────────────────────────
let pendingMarker = null;

function placePendingPin(lat, lng) {
  pendingLat = lat; pendingLng = lng;
  if (pendingMarker) map.removeLayer(pendingMarker);
  pendingMarker = L.marker([lat, lng], {
    icon: makeIcon('#aaa'),
    opacity: 0.7,
    zIndexOffset: 1000,
  }).addTo(map).bindPopup('<span style="color:#90a4ae;font-size:0.8rem">Fill in details and click Save Pin</span>').openPopup();
  document.getElementById('btn-save').disabled = false;
}

// ── Map click → place pending pin ───────────────────────────────────────────
map.on('click', e => {
  placePendingPin(e.latlng.lat, e.latlng.lng);
  setStatus(`Pin placed at ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`, 'ok');
});

// ── Geocode ──────────────────────────────────────────────────────────────────
document.getElementById('btn-geocode').addEventListener('click', async () => {
  const raw = document.getElementById('input-address').value.trim();
  if (!raw) { setStatus('Enter an address first.', 'err'); return; }

  const query = raw.toLowerCase().includes('florida') || raw.toLowerCase().includes(', fl')
    ? raw
    : raw + ', Polk County, Florida';

  setStatus('Searching…');
  document.getElementById('btn-geocode').disabled = true;

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&countrycodes=us`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();

    if (!data.length) {
      setStatus('Address not found. Try adding "Lakeland, FL" or click on the map.', 'err');
    } else {
      const { lat, lon, display_name } = data[0];
      placePendingPin(parseFloat(lat), parseFloat(lon));
      map.setView([parseFloat(lat), parseFloat(lon)], 16);
      setStatus('Found! Review pin, then click Save Pin.', 'ok');
    }
  } catch {
    setStatus('Geocoding failed. Click on the map instead.', 'err');
  } finally {
    document.getElementById('btn-geocode').disabled = false;
  }
});

// ── Save pin ─────────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  const label   = document.getElementById('input-label').value.trim();
  const address = document.getElementById('input-address').value.trim();
  const notes   = document.getElementById('input-notes').value.trim();
  const name    = document.getElementById('input-name').value.trim() || 'Anonymous';

  if (!label)   { setStatus('Please enter a label.', 'err'); return; }
  if (!address) { setStatus('Please enter an address.', 'err'); return; }
  if (pendingLat == null) { setStatus('Place a pin first (search or click map).', 'err'); return; }

  try {
    const res = await fetch('/api/addresses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label, address, notes, lat: pendingLat, lng: pendingLng, added_by: name, color: selectedColor }),
    });
    if (!res.ok) throw new Error();
    const entry = await res.json();

    if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
    pendingLat = pendingLng = null;
    document.getElementById('btn-save').disabled = true;

    // clear form
    ['input-label','input-address','input-notes'].forEach(id => document.getElementById(id).value = '');
    setStatus('Saved!', 'ok');
    setTimeout(() => setStatus(''), 3000);

    addMarker(entry);
    prependCard(entry);
    allEntries.unshift(entry);
    updateCount();
  } catch {
    setStatus('Save failed. Please try again.', 'err');
  }
});

// ── Render marker ────────────────────────────────────────────────────────────
function addMarker(entry) {
  const m = L.marker([entry.lat, entry.lng], { icon: makeIcon(entry.color || '#e74c3c') }).addTo(map);
  m.bindPopup(`
    <div class="popup-label">${escHtml(entry.label)}</div>
    <div class="popup-address">${escHtml(entry.address)}</div>
    ${entry.notes ? `<div class="popup-notes">${escHtml(entry.notes)}</div>` : ''}
    <div class="popup-meta">Added by ${escHtml(entry.added_by)} · ${formatDate(entry.created_at)}</div>
  `);
  markers[entry.id] = m;
  return m;
}

// ── Render sidebar card ───────────────────────────────────────────────────────
function prependCard(entry) {
  const list = document.getElementById('entries-list');
  const card = buildCard(entry);
  list.prepend(card);
}

function buildCard(entry) {
  const card = document.createElement('div');
  card.className = 'entry-card';
  card.dataset.id = entry.id;
  card.innerHTML = `
    <div class="entry-label">
      <span class="entry-dot" style="background:${entry.color || '#e74c3c'}"></span>
      ${escHtml(entry.label)}
    </div>
    <div class="entry-address">${escHtml(entry.address)}</div>
    ${entry.notes ? `<div class="entry-notes">${escHtml(entry.notes)}</div>` : ''}
    <div class="entry-meta">By ${escHtml(entry.added_by)} · ${formatDate(entry.created_at)}</div>
    <button class="entry-delete" title="Delete" data-id="${entry.id}">✕</button>
  `;
  card.querySelector('.entry-delete').addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm(`Delete "${entry.label}"?`)) return;
    const res = await fetch(`/api/addresses/${entry.id}`, { method: 'DELETE' });
    if (res.ok) {
      card.remove();
      if (markers[entry.id]) { map.removeLayer(markers[entry.id]); delete markers[entry.id]; }
      allEntries = allEntries.filter(a => a.id !== entry.id);
      updateCount();
    }
  });
  card.addEventListener('click', () => {
    map.setView([entry.lat, entry.lng], 17);
    if (markers[entry.id]) markers[entry.id].openPopup();
  });
  return card;
}

// ── Load existing ─────────────────────────────────────────────────────────────
async function loadAll() {
  const res  = await fetch('/api/addresses');
  const list = await res.json();
  allEntries = list;
  const container = document.getElementById('entries-list');

  if (!list.length) {
    container.innerHTML = '<div class="empty-state">No addresses yet.<br>Add one above or click the map.</div>';
  } else {
    container.innerHTML = '';
    list.forEach(e => { addMarker(e); container.appendChild(buildCard(e)); });
  }
  updateCount();
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.entry-card').forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(q) ? '' : 'none';
  });
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function updateCount() {
  document.getElementById('entry-count').textContent = allEntries.length;
  const container = document.getElementById('entries-list');
  if (!allEntries.length && !container.querySelector('.entry-card')) {
    container.innerHTML = '<div class="empty-state">No addresses yet.<br>Add one above or click the map.</div>';
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
