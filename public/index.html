<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Map — Save Places from TikTok</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #010101;
      color: #eee;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 360px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: #111;
      border-right: 1px solid #222;
      z-index: 1000;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px 16px 12px;
      background: #000;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tt-logo {
      font-size: 1.5rem;
      line-height: 1;
    }

    #sidebar-header h1 {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    #sidebar-header p {
      font-size: 0.7rem;
      color: #888;
      margin-top: 1px;
    }

    /* ── Form ── */
    #add-form {
      padding: 14px;
      border-bottom: 1px solid #222;
      background: #0a0a0a;
      flex-shrink: 0;
    }

    #add-form h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #fe2c55;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .form-row { margin-bottom: 9px; }

    .form-row label {
      display: block;
      font-size: 0.7rem;
      color: #777;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row input,
    .form-row textarea {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #eee;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .form-row input:focus,
    .form-row textarea:focus { border-color: #fe2c55; }

    /* ── Location autocomplete ── */
    .location-wrap { position: relative; }

    #location-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 2px);
      left: 0; right: 0;
      background: #1a1a1a;
      border: 1px solid #fe2c55;
      border-radius: 8px;
      overflow: hidden;
      z-index: 9999;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    #location-dropdown.open { display: block; }

    .loc-option {
      padding: 9px 12px;
      font-size: 0.8rem;
      color: #ddd;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
      line-height: 1.3;
    }

    .loc-option:last-child { border-bottom: none; }

    .loc-option:hover,
    .loc-option.active { background: #2a2a2a; color: #fff; }

    .loc-option .loc-main { font-weight: 600; color: #fff; }
    .loc-option .loc-sub  { font-size: 0.7rem; color: #888; margin-top: 1px; }

    #loc-searching {
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
    }

    /* TikTok preview strip */
    #tt-preview {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 9px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #tt-preview.visible { display: flex; }

    #tt-thumb {
      width: 48px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: #333;
    }

    #tt-info { min-width: 0; }

    #tt-title {
      font-size: 0.78rem;
      color: #eee;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #tt-author {
      font-size: 0.7rem;
      color: #fe2c55;
      margin-top: 2px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-fetch {
      flex: 1;
      padding: 8px;
      background: #fe2c55;
      color: #fff;
    }

    #btn-geocode {
      flex: 1;
      padding: 8px;
      background: #25f4ee;
      color: #000;
    }

    #btn-save {
      flex: 1;
      padding: 8px;
      background: #fff;
      color: #000;
    }

    #status-msg {
      font-size: 0.7rem;
      color: #777;
      margin-top: 5px;
      min-height: 16px;
    }

    #status-msg.ok { color: #25f4ee; }
    #status-msg.err { color: #fe2c55; }

    /* ── Entries list ── */
    #entries-header {
      padding: 10px 14px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #entries-header h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #fe2c55;
      font-weight: 700;
    }

    #entry-count {
      font-size: 0.7rem;
      color: #777;
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #search-box {
      padding: 0 14px 8px;
      flex-shrink: 0;
    }

    #search-input {
      width: 100%;
      padding: 7px 10px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #eee;
      font-size: 0.8rem;
      outline: none;
    }

    #search-input:focus { border-color: #fe2c55; }

    #entries-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
    }

    #entries-list::-webkit-scrollbar { width: 4px; }
    #entries-list::-webkit-scrollbar-track { background: transparent; }
    #entries-list::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    .entry-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 0;
      margin-bottom: 7px;
      cursor: pointer;
      transition: border-color 0.15s;
      overflow: hidden;
      position: relative;
      display: flex;
      gap: 0;
    }

    .entry-card:hover { border-color: #fe2c55; }

    .entry-thumb-wrap {
      width: 56px;
      flex-shrink: 0;
      background: #222;
      position: relative;
    }

    .entry-thumb {
      width: 56px;
      height: 75px;
      object-fit: cover;
      display: block;
    }

    .entry-thumb-placeholder {
      width: 56px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: #222;
    }

    .entry-body {
      flex: 1;
      padding: 8px 32px 8px 10px;
      min-width: 0;
    }

    .entry-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #eee;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .entry-location {
      font-size: 0.72rem;
      color: #25f4ee;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-location::before { content: '📍 '; }

    .entry-author {
      font-size: 0.68rem;
      color: #666;
      margin-top: 3px;
    }

    .entry-notes-text {
      font-size: 0.7rem;
      color: #888;
      margin-top: 3px;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .entry-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      background: transparent;
      color: #444;
      font-size: 0.75rem;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .entry-delete:hover { background: #111; color: #fe2c55; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #444;
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .empty-state .big { font-size: 2rem; margin-bottom: 8px; }

    /* ── Map ── */
    #map { flex: 1; height: 100%; }

    /* ── Popup styling ── */
    .leaflet-popup-content-wrapper {
      background: #111;
      color: #eee;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .leaflet-popup-content {
      margin: 0;
      width: 220px !important;
    }

    .leaflet-popup-tip { background: #111; }

    .popup-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .popup-thumb-placeholder {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: #222;
    }

    .popup-body { padding: 10px 12px 12px; }

    .popup-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: #fff;
      line-height: 1.3;
    }

    .popup-location {
      font-size: 0.75rem;
      color: #25f4ee;
      margin-top: 4px;
    }

    .popup-notes {
      font-size: 0.74rem;
      color: #888;
      margin-top: 4px;
      font-style: italic;
    }

    .popup-link {
      display: block;
      margin-top: 10px;
      padding: 7px 12px;
      background: #fe2c55;
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      transition: opacity 0.15s;
    }

    .popup-link:hover { opacity: 0.85; }

    /* ── Responsive ── */
    @media (max-width: 620px) {
      #sidebar { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid #222; min-width: 0; }
      body { flex-direction: column; }
      #map { height: 50vh; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div class="tt-logo">🎵</div>
    <div>
      <h1>TikTok Map</h1>
      <p>Bookmark places from TikTok — never forget where it was</p>
    </div>
  </div>

  <div id="add-form">
    <h2>Save a TikTok Place</h2>

    <div class="form-row">
      <label>TikTok Link *</label>
      <input type="url" id="input-tiktok-url" placeholder="https://www.tiktok.com/@user/video/…" />
    </div>

    <div class="form-actions" style="margin-bottom:9px">
      <button id="btn-fetch">🎵 Load TikTok</button>
    </div>

    <div id="tt-preview">
      <img id="tt-thumb" src="" alt="thumbnail" />
      <div id="tt-info">
        <div id="tt-title"></div>
        <div id="tt-author"></div>
      </div>
    </div>

    <div class="form-row">
      <label>Place / Location *</label>
      <div class="location-wrap">
        <input type="text" id="input-location" placeholder="e.g. Joe's Crab Shack, Miami Beach, FL" autocomplete="off" />
        <div id="location-dropdown"></div>
      </div>
    </div>

    <div class="form-row">
      <label>Notes (optional)</label>
      <textarea id="input-notes" rows="2" placeholder="Looks amazing, must visit in summer…"></textarea>
    </div>

    <div id="status-msg"></div>

    <div class="form-actions">
      <button id="btn-geocode" disabled>🔍 Find on Map</button>
      <button id="btn-save" disabled>📍 Save Pin</button>
    </div>
  </div>

  <div id="entries-header">
    <h2>Saved Places</h2>
    <span id="entry-count">0</span>
  </div>

  <div id="search-box">
    <input type="text" id="search-input" placeholder="Search saved places…" />
  </div>

  <div id="entries-list">
    <div class="empty-state">
      <div class="big">🗺️</div>
      Paste a TikTok link above to pin a place on the map.
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── State ────────────────────────────────────────────────────────────────────
let pendingLat = null, pendingLng = null;
let pendingMarker = null;
let markers = {};
let allPins = [];
let ttData = { title: '', thumbnail_url: '', author: '' };

// ── Map setup ────────────────────────────────────────────────────────────────
const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg, type = '') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type;
}

function makeTtIcon(thumbUrl) {
  const img = thumbUrl
    ? `<img src="${thumbUrl}" style="width:36px;height:48px;object-fit:cover;border-radius:4px;display:block;" crossorigin="anonymous" onerror="this.style.display='none'" />`
    : `<div style="width:36px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#222;border-radius:4px;">🎵</div>`;

  return L.divIcon({
    html: `<div style="position:relative;width:36px;">
      ${img}
      <div style="
        position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
        width:0;height:0;
        border-left:6px solid transparent;
        border-right:6px solid transparent;
        border-top:10px solid #fe2c55;
      "></div>
    </div>`,
    className: '',
    iconSize: [36, 56],
    iconAnchor: [18, 56],
    popupAnchor: [0, -58],
  });
}

function makeGrayIcon() {
  return L.divIcon({
    html: `<div style="width:12px;height:12px;background:#fe2c55;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.5);"></div>`,
    className: '',
    iconSize: [12, 12],
    iconAnchor: [6, 6],
  });
}

// ── Pending pin ──────────────────────────────────────────────────────────────
function placePendingPin(lat, lng) {
  pendingLat = lat; pendingLng = lng;
  if (pendingMarker) map.removeLayer(pendingMarker);
  pendingMarker = L.marker([lat, lng], { icon: makeGrayIcon(), zIndexOffset: 1000 }).addTo(map);
  document.getElementById('btn-save').disabled = false;
}

map.on('click', e => {
  placePendingPin(e.latlng.lat, e.latlng.lng);
  setStatus(`Pin placed — click Save Pin when ready.`, 'ok');
});

// ── Fetch TikTok metadata ────────────────────────────────────────────────────
document.getElementById('btn-fetch').addEventListener('click', async () => {
  const url = document.getElementById('input-tiktok-url').value.trim();
  if (!url) { setStatus('Paste a TikTok link first.', 'err'); return; }

  setStatus('Loading TikTok info…');
  document.getElementById('btn-fetch').disabled = true;

  try {
    const res = await fetch(`/api/tiktok-oembed?url=${encodeURIComponent(url)}`);
    const data = await res.json();

    if (data.error) {
      setStatus('Could not load TikTok — you can still save manually.', 'err');
      ttData = { title: '', thumbnail_url: '', author: '' };
    } else {
      ttData = data;
      const preview = document.getElementById('tt-preview');
      document.getElementById('tt-title').textContent = data.title || '(no title)';
      document.getElementById('tt-author').textContent = data.author ? '@' + data.author : '';
      if (data.thumbnail_url) {
        document.getElementById('tt-thumb').src = data.thumbnail_url;
      } else {
        document.getElementById('tt-thumb').style.display = 'none';
      }
      preview.classList.add('visible');
      setStatus('TikTok loaded! Now enter the location.', 'ok');
    }
    document.getElementById('btn-geocode').disabled = false;
  } catch {
    setStatus('Network error — you can still save manually.', 'err');
    document.getElementById('btn-geocode').disabled = false;
    ttData = { title: '', thumbnail_url: '', author: '' };
  } finally {
    document.getElementById('btn-fetch').disabled = false;
  }
});

// ── Location autocomplete ─────────────────────────────────────────────────────
const locInput    = document.getElementById('input-location');
const locDropdown = document.getElementById('location-dropdown');
let locDebounce   = null;
let activeIdx     = -1;
let locResults    = [];

function closeDropdown() {
  locDropdown.classList.remove('open');
  activeIdx = -1;
}

function renderDropdown(results) {
  locResults = results;
  activeIdx  = -1;
  if (!results.length) { closeDropdown(); return; }

  locDropdown.innerHTML = results.map((r, i) => {
    const parts  = r.display_name.split(', ');
    const main   = parts.slice(0, 2).join(', ');
    const sub    = parts.slice(2).join(', ');
    return `<div class="loc-option" data-idx="${i}">
      <div class="loc-main">${esc(main)}</div>
      ${sub ? `<div class="loc-sub">${esc(sub)}</div>` : ''}
    </div>`;
  }).join('');

  locDropdown.querySelectorAll('.loc-option').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      selectResult(parseInt(el.dataset.idx));
    });
  });

  locDropdown.classList.add('open');
}

function selectResult(idx) {
  const r = locResults[idx];
  if (!r) return;
  const parts = r.display_name.split(', ');
  locInput.value = parts.slice(0, 2).join(', ');
  closeDropdown();
  placePendingPin(parseFloat(r.lat), parseFloat(r.lon));
  map.setView([parseFloat(r.lat), parseFloat(r.lon)], 14);
  setStatus('Location set — click Save Pin when ready.', 'ok');
  document.getElementById('btn-save').disabled = false;
}

locInput.addEventListener('input', () => {
  clearTimeout(locDebounce);
  const q = locInput.value.trim();
  if (q.length < 3) { closeDropdown(); return; }

  locDropdown.innerHTML = '<div id="loc-searching">Searching…</div>';
  locDropdown.classList.add('open');

  locDebounce = setTimeout(async () => {
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&addressdetails=0`;
      const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const data = await res.json();
      renderDropdown(data);
    } catch {
      closeDropdown();
    }
  }, 350);
});

locInput.addEventListener('keydown', e => {
  const opts = locDropdown.querySelectorAll('.loc-option');
  if (!opts.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, opts.length - 1);
    opts.forEach((o, i) => o.classList.toggle('active', i === activeIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    opts.forEach((o, i) => o.classList.toggle('active', i === activeIdx));
  } else if (e.key === 'Enter' && activeIdx >= 0) {
    e.preventDefault();
    selectResult(activeIdx);
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
});

locInput.addEventListener('blur', () => setTimeout(closeDropdown, 150));

// ── Geocode button (fallback for manual entry) ────────────────────────────────
document.getElementById('btn-geocode').addEventListener('click', async () => {
  const loc = locInput.value.trim();
  if (!loc) { setStatus('Enter a place or address first.', 'err'); return; }

  setStatus('Searching for location…');
  document.getElementById('btn-geocode').disabled = true;

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();

    if (!data.length) {
      setStatus('Location not found. Try a more specific address, or click the map.', 'err');
    } else {
      placePendingPin(parseFloat(data[0].lat), parseFloat(data[0].lon));
      map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 14);
      setStatus('Found! Review the pin, then click Save Pin.', 'ok');
    }
  } catch {
    setStatus('Search failed. Click the map to place a pin manually.', 'err');
  } finally {
    document.getElementById('btn-geocode').disabled = false;
  }
});

// ── Save pin ─────────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  const tiktok_url   = document.getElementById('input-tiktok-url').value.trim();
  const location_name = document.getElementById('input-location').value.trim();
  const notes        = document.getElementById('input-notes').value.trim();

  if (!tiktok_url)    { setStatus('Paste a TikTok link first.', 'err'); return; }
  if (!location_name) { setStatus('Enter a location name.', 'err'); return; }
  if (pendingLat == null) { setStatus('Find a location or click the map to place a pin.', 'err'); return; }

  document.getElementById('btn-save').disabled = true;

  try {
    const res = await fetch('/api/pins', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tiktok_url,
        title: ttData.title,
        thumbnail_url: ttData.thumbnail_url,
        author: ttData.author,
        location_name,
        lat: pendingLat,
        lng: pendingLng,
        notes,
      }),
    });
    if (!res.ok) throw new Error();
    const pin = await res.json();

    if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
    pendingLat = pendingLng = null;

    // Reset form
    document.getElementById('input-tiktok-url').value = '';
    document.getElementById('input-location').value = '';
    document.getElementById('input-notes').value = '';
    document.getElementById('tt-preview').classList.remove('visible');
    document.getElementById('tt-thumb').src = '';
    document.getElementById('tt-thumb').style.display = '';
    document.getElementById('btn-geocode').disabled = true;
    ttData = { title: '', thumbnail_url: '', author: '' };

    setStatus('Saved!', 'ok');
    setTimeout(() => setStatus(''), 3000);

    addMarker(pin);
    prependCard(pin);
    allPins.unshift(pin);
    updateCount();
  } catch {
    setStatus('Save failed. Please try again.', 'err');
    document.getElementById('btn-save').disabled = false;
  }
});

// ── Marker ───────────────────────────────────────────────────────────────────
function addMarker(pin) {
  const icon = makeTtIcon(pin.thumbnail_url);
  const m = L.marker([pin.lat, pin.lng], { icon }).addTo(map);

  const thumbHtml = pin.thumbnail_url
    ? `<img class="popup-thumb" src="${esc(pin.thumbnail_url)}" alt="thumbnail" crossorigin="anonymous" onerror="this.style.display='none'" />`
    : `<div class="popup-thumb-placeholder">🎵</div>`;

  m.bindPopup(`
    ${thumbHtml}
    <div class="popup-body">
      <div class="popup-title">${esc(pin.title || pin.location_name)}</div>
      <div class="popup-location">${esc(pin.location_name)}</div>
      ${pin.notes ? `<div class="popup-notes">${esc(pin.notes)}</div>` : ''}
      <a class="popup-link" href="${esc(pin.tiktok_url)}" target="_blank" rel="noopener">▶ Watch on TikTok</a>
    </div>
  `, { maxWidth: 240 });

  markers[pin.id] = m;
  return m;
}

// ── Sidebar card ─────────────────────────────────────────────────────────────
function prependCard(pin) {
  const list = document.getElementById('entries-list');
  const empty = list.querySelector('.empty-state');
  if (empty) empty.remove();
  list.prepend(buildCard(pin));
}

function buildCard(pin) {
  const card = document.createElement('div');
  card.className = 'entry-card';
  card.dataset.id = pin.id;

  const thumbHtml = pin.thumbnail_url
    ? `<img class="entry-thumb" src="${esc(pin.thumbnail_url)}" alt="thumb" crossorigin="anonymous" onerror="this.parentElement.innerHTML='<div class=entry-thumb-placeholder>🎵</div>'" />`
    : `<div class="entry-thumb-placeholder">🎵</div>`;

  card.innerHTML = `
    <div class="entry-thumb-wrap">${thumbHtml}</div>
    <div class="entry-body">
      <div class="entry-title">${esc(pin.title || '(no title)')}</div>
      <div class="entry-location">${esc(pin.location_name)}</div>
      ${pin.author ? `<div class="entry-author">@${esc(pin.author)}</div>` : ''}
      ${pin.notes ? `<div class="entry-notes-text">${esc(pin.notes)}</div>` : ''}
    </div>
    <button class="entry-delete" title="Delete" data-id="${pin.id}">✕</button>
  `;

  card.querySelector('.entry-delete').addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm(`Delete pin for "${pin.location_name}"?`)) return;
    const res = await fetch(`/api/pins/${pin.id}`, { method: 'DELETE' });
    if (res.ok) {
      card.remove();
      if (markers[pin.id]) { map.removeLayer(markers[pin.id]); delete markers[pin.id]; }
      allPins = allPins.filter(p => p.id !== pin.id);
      updateCount();
    }
  });

  card.addEventListener('click', () => {
    map.setView([pin.lat, pin.lng], 15);
    if (markers[pin.id]) markers[pin.id].openPopup();
  });

  return card;
}

// ── Load all ─────────────────────────────────────────────────────────────────
async function loadAll() {
  const res  = await fetch('/api/pins');
  const list = await res.json();
  allPins = list;
  const container = document.getElementById('entries-list');

  if (!list.length) {
    container.innerHTML = `<div class="empty-state"><div class="big">🗺️</div>Paste a TikTok link above to pin a place on the map.</div>`;
  } else {
    container.innerHTML = '';
    list.forEach(p => { addMarker(p); container.appendChild(buildCard(p)); });
  }
  updateCount();
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.entry-card').forEach(card => {
    card.style.display = card.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

// ── Count ─────────────────────────────────────────────────────────────────────
function updateCount() {
  document.getElementById('entry-count').textContent = allPins.length;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
